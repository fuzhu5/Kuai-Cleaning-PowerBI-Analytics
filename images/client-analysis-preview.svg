<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- Client dashboard preview shows the real revenue mix and latest period change. -->
  <style>.bg{fill:#f4f7fb}.panel{fill:#fff;stroke:#dfe7ef}.title{font:700 25px Arial;fill:#152536}.sub{font:14px Arial;fill:#64748b}.label{font:12px Arial;fill:#64748b}.value{font:700 25px Arial;fill:#152536}.blue{fill:#2f6fed}.teal{fill:#16a3a6}.orange{fill:#f59e0b}.green{fill:#238b57}.red{fill:#c94b4b}.axis{stroke:#d8e1ea}.row{fill:#f8fafc}</style>
  <rect width="1200" height="675" class="bg"/>
  <text x="34" y="43" class="title">Client Analysis</text><text x="34" y="67" class="sub">Revenue, margin and latest Billing Period movement</text>
  <!-- Three Client cards. -->
  <g transform="translate(34 92)"><rect width="354" height="132" rx="12" class="panel"/><text x="20" y="31" class="sub">Client 1</text><text x="20" y="69" class="value">A$24,522.74</text><text x="20" y="94" class="label">55.3% revenue share · 38.8% margin</text><text x="20" y="117" class="red">-8.7% latest vs previous</text></g>
  <g transform="translate(423 92)"><rect width="354" height="132" rx="12" class="panel"/><text x="20" y="31" class="sub">Client 2</text><text x="20" y="69" class="value">A$13,078.91</text><text x="20" y="94" class="label">29.5% revenue share · 36.5% margin</text><text x="20" y="117" class="red">-2.9% latest vs previous</text></g>
  <g transform="translate(812 92)"><rect width="354" height="132" rx="12" class="panel"/><text x="20" y="31" class="sub">Client 3</text><text x="20" y="69" class="value">A$6,740.66</text><text x="20" y="94" class="label">15.2% revenue share · 42.8% margin</text><text x="20" y="117" class="green">+20.6% latest vs previous</text></g>
  <!-- Revenue share bars. -->
  <g transform="translate(34 248)">
    <rect width="560" height="381" rx="12" class="panel"/><text x="22" y="34" class="sub">Revenue share</text>
    <text x="22" y="91" class="label">Client 1</text><rect x="110" y="72" width="388" height="28" rx="6" class="blue"/><text x="508" y="92" class="sub">55.3%</text>
    <text x="22" y="157" class="label">Client 2</text><rect x="110" y="138" width="207" height="28" rx="6" class="teal"/><text x="327" y="158" class="sub">29.5%</text>
    <text x="22" y="223" class="label">Client 3</text><rect x="110" y="204" width="107" height="28" rx="6" class="orange"/><text x="227" y="224" class="sub">15.2%</text>
    <line x1="22" y1="273" x2="538" y2="273" class="axis"/>
    <text x="22" y="309" class="label">MAIN RISK</text><text x="22" y="340" class="sub">Client 1 is more than half of Work Item revenue</text><text x="22" y="362" class="sub">and fell in the latest period.</text>
  </g>
  <!-- Client operating table. -->
  <g transform="translate(612 248)">
    <rect width="554" height="381" rx="12" class="panel"/><text x="22" y="34" class="sub">Activity and margin</text>
    <text x="22" y="72" class="label">CLIENT</text><text x="124" y="72" class="label">ITEMS</text><text x="216" y="72" class="label">PROPERTIES</text><text x="338" y="72" class="label">INCOME</text><text x="458" y="72" class="label">MARGIN</text>
    <rect x="14" y="87" width="526" height="58" rx="7" class="row"/><text x="22" y="122" class="sub">Client 1</text><text x="124" y="122" class="sub">447</text><text x="216" y="122" class="sub">81</text><text x="338" y="122" class="sub">A$9,514</text><text x="458" y="122" class="sub">38.8%</text>
    <rect x="14" y="154" width="526" height="58" rx="7" class="row"/><text x="22" y="189" class="sub">Client 2</text><text x="124" y="189" class="sub">211</text><text x="216" y="189" class="sub">51</text><text x="338" y="189" class="sub">A$4,780</text><text x="458" y="189" class="sub">36.5%</text>
    <rect x="14" y="221" width="526" height="58" rx="7" class="row"/><text x="22" y="256" class="sub">Client 3</text><text x="124" y="256" class="sub">117</text><text x="216" y="256" class="sub">49</text><text x="338" y="256" class="sub">A$2,886</text><text x="458" y="256" class="sub">42.8%</text>
    <text x="22" y="326" class="label">OPPORTUNITY</text><text x="22" y="354" class="sub">Review what drove Client 3's growth and margin.</text>
  </g>
</svg>
