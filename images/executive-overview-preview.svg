<?xml version="1.0" encoding="UTF-8"?>
<!-- Design preview for the proposed Power BI Executive Overview page. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kuai Cleaning executive dashboard design preview</title>
  <desc id="desc">A portfolio mock-up showing KPI cards, billing-period revenue and margin trends, and management insights.</desc>

  <!-- Shared dashboard background and typography. -->
  <rect width="1200" height="675" fill="#F5F7FA"/>
  <style>
    .title { font: 700 25px Arial, sans-serif; fill: #FFFFFF; }
    .subtitle { font: 400 12px Arial, sans-serif; fill: #CAD5E1; }
    .label { font: 600 11px Arial, sans-serif; fill: #64748B; letter-spacing: .4px; }
    .value { font: 700 26px Arial, sans-serif; fill: #172B4D; }
    .small { font: 400 11px Arial, sans-serif; fill: #64748B; }
    .section { font: 700 14px Arial, sans-serif; fill: #172B4D; }
    .axis { font: 400 9px Arial, sans-serif; fill: #7B8794; }
  </style>

  <!-- Report header with business question and evidence label. -->
  <rect x="0" y="0" width="1200" height="78" fill="#172B4D"/>
  <text x="38" y="34" class="title">Kuai Cleaning | Operations &amp; Profitability</text>
  <text x="38" y="57" class="subtitle">Can the business protect margin while operating volume and billing adjustments change?</text>
  <rect x="1000" y="22" width="160" height="32" rx="16" fill="#244464"/>
  <text x="1080" y="42" text-anchor="middle" class="subtitle">ANONYMISED REAL VALUES</text>

  <!-- KPI cards summarise the complete public sample. -->
  <g transform="translate(38,100)">
    <rect width="200" height="88" rx="8" fill="#FFFFFF"/>
    <text x="18" y="25" class="label">CLIENT REVENUE</text>
    <text x="18" y="59" class="value">A$45.9k</text>
    <text x="18" y="77" class="small">10 billing periods</text>
  </g>
  <g transform="translate(252,100)">
    <rect width="200" height="88" rx="8" fill="#FFFFFF"/>
    <text x="18" y="25" class="label">BUSINESS INCOME</text>
    <text x="18" y="59" class="value">A$18.2k</text>
    <text x="18" y="77" class="small">Financial identity: Pass</text>
  </g>
  <g transform="translate(466,100)">
    <rect width="200" height="88" rx="8" fill="#FFFFFF"/>
    <text x="18" y="25" class="label">BUSINESS MARGIN</text>
    <text x="18" y="59" class="value">39.6%</text>
    <text x="18" y="77" class="small">Latest period: 33.2%</text>
  </g>
  <g transform="translate(680,100)">
    <rect width="200" height="88" rx="8" fill="#FFFFFF"/>
    <text x="18" y="25" class="label">WORK ITEMS</text>
    <text x="18" y="59" class="value">775</text>
    <text x="18" y="77" class="small">631 Jobs · 144 Tasks</text>
  </g>

  <!-- Main trend visual combines revenue bars with margin line. -->
  <g transform="translate(38,210)">
    <rect width="842" height="390" rx="8" fill="#FFFFFF"/>
    <text x="22" y="30" class="section">Revenue and margin by billing period</text>
    <text x="22" y="50" class="small">Revenue volume fell after April; the latest three margins remain below 36%.</text>
    <!-- Time selector keeps Billing Period as the default and Month as optional. -->
    <rect x="390" y="16" width="105" height="25" rx="12" fill="#172B4D"/>
    <text x="442" y="33" text-anchor="middle" class="subtitle">Billing Period</text>
    <rect x="500" y="16" width="72" height="25" rx="12" fill="#E7ECF2"/>
    <text x="536" y="33" text-anchor="middle" class="small">Month</text>
    <line x1="60" y1="330" x2="805" y2="330" stroke="#CBD5E1"/>
    <line x1="60" y1="260" x2="805" y2="260" stroke="#E7ECF2"/>
    <line x1="60" y1="190" x2="805" y2="190" stroke="#E7ECF2"/>
    <line x1="60" y1="120" x2="805" y2="120" stroke="#E7ECF2"/>
    <text x="18" y="334" class="axis">0</text>
    <text x="10" y="264" class="axis">2k</text>
    <text x="10" y="194" class="axis">4k</text>
    <text x="10" y="124" class="axis">6k</text>

    <!-- Revenue columns use the ten real billing-period totals. -->
    <g fill="#4C78A8">
      <rect x="70" y="65" width="48" height="265" rx="3"/>
      <rect x="143" y="50" width="48" height="280" rx="3"/>
      <rect x="216" y="134" width="48" height="196" rx="3"/>
      <rect x="289" y="109" width="48" height="221" rx="3"/>
      <rect x="362" y="238" width="48" height="92" rx="3"/>
      <rect x="435" y="243" width="48" height="87" rx="3"/>
      <rect x="508" y="227" width="48" height="103" rx="3"/>
      <rect x="581" y="197" width="48" height="133" rx="3"/>
      <rect x="654" y="217" width="48" height="113" rx="3"/>
      <rect x="727" y="219" width="48" height="111" rx="3"/>
    </g>

    <!-- Margin line makes deterioration visible without conflating it with volume. -->
    <polyline points="94,95 167,145 240,202 313,128 386,101 459,148 532,104 605,194 678,209 751,216" fill="none" stroke="#E07A5F" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#E07A5F">
      <circle cx="94" cy="95" r="4"/><circle cx="167" cy="145" r="4"/><circle cx="240" cy="202" r="4"/>
      <circle cx="313" cy="128" r="4"/><circle cx="386" cy="101" r="4"/><circle cx="459" cy="148" r="4"/>
      <circle cx="532" cy="104" r="4"/><circle cx="605" cy="194" r="4"/><circle cx="678" cy="209" r="4"/><circle cx="751" cy="216" r="4"/>
    </g>
    <text x="72" y="355" class="axis">30 Mar</text><text x="218" y="355" class="axis">27 Apr</text>
    <text x="364" y="355" class="axis">25 May</text><text x="510" y="355" class="axis">22 Jun</text>
    <text x="656" y="355" class="axis">20 Jul</text><text x="730" y="355" class="axis">03 Aug</text>
    <rect x="610" y="24" width="12" height="12" fill="#4C78A8"/><text x="628" y="34" class="small">Revenue</text>
    <line x1="700" y1="30" x2="718" y2="30" stroke="#E07A5F" stroke-width="3"/><text x="724" y="34" class="small">Margin</text>
  </g>

  <!-- Insight panel translates chart movement into management actions. -->
  <g transform="translate(902,100)">
    <rect width="260" height="500" rx="8" fill="#FFFFFF"/>
    <text x="20" y="34" class="section">Management signals</text>
    <rect x="20" y="56" width="220" height="92" rx="6" fill="#FFF4E5"/>
    <text x="34" y="80" class="label" fill="#9A6700">MARGIN PRESSURE</text>
    <text x="34" y="104" class="small">Latest margin is 33.2%, down</text>
    <text x="34" y="121" class="small">from 44.8% in the first period.</text>
    <text x="34" y="138" class="small">Review work mix and property pricing.</text>

    <rect x="20" y="164" width="220" height="92" rx="6" fill="#EAF4FF"/>
    <text x="34" y="188" class="label">OPERATING CONTROL</text>
    <text x="34" y="212" class="small">64 assignment overrides recorded.</text>
    <text x="34" y="229" class="small">Use worker and property drill-through</text>
    <text x="34" y="246" class="small">to distinguish exceptions from patterns.</text>

    <rect x="20" y="272" width="220" height="92" rx="6" fill="#EAF7EF"/>
    <text x="34" y="296" class="label" fill="#237A46">DATA TRUST</text>
    <text x="34" y="320" class="small">All public financial rows reconcile.</text>
    <text x="34" y="337" class="small">Automated privacy and schema tests</text>
    <text x="34" y="354" class="small">pass for this release snapshot.</text>

    <text x="20" y="410" class="section">Recommended next action</text>
    <text x="20" y="436" class="small">Prioritise the high-activity properties</text>
    <text x="20" y="453" class="small">with below-average Business Margin,</text>
    <text x="20" y="470" class="small">then review quote and work mix.</text>
  </g>

  <!-- Footer prevents the SVG from being mistaken for a validated Power BI render. -->
  <text x="38" y="642" class="small">REPORT DESIGN PREVIEW · Build and validate visuals in Power BI Desktop before publication</text>
</svg>
